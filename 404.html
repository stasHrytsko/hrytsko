:root{

  --sans:Inter,"Helvetica Neue","Segoe UI",system-ui,Arial,sans-serif;

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:17px/1.65 var(--sans); -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; min-height:100svh;

.status{
  background:var(--ink); color:#e3e3e0; text-align:center;

  width:100%; max-width:1400px; margin:auto; padding:48px 56px;

.wordmark{color:var(--ink); font-size:clamp(44px,9vw,92px); font-weight:800; letter-spacing:-.055em; line-height:1; margin:0}
.wordmark span{color:var(--accent)}
h1{
  font-size:clamp(26px,4vw,44px); font-weight:700; letter-spacing:-.04em;
  line-height:1.12; margin:36px 0 0; max-width:17ch;
}
p{font-size:clamp(17px,2vw,21px); color:var(--muted); margin:20px 0 0; max-width:46ch}
footer{
  width:100%; max-width:1400px; margin:auto; padding:0 56px 34px;
  display:flex; justify-content:space-between; gap:20px;
  border-top:1px solid var(--line); padding-top:24px;
  font:12px/1.5 var(--mono); color:var(--muted);
}
@media(max-width:760px){
  main{padding:40px 22px}
  footer{padding:24px 22px 28px}
  .status{font-size:11px; padding:6px 10px}
}
</style>
